# Read by SonarQube Cloud's automatic analysis (it ignores sonar-project.properties).
#
# browser-extension/chrome-unpacked/ is a ready-made copy of source/browser-extension/ for people who
# browse the repository (see "HOW TO INSTALL.txt"). It repeats that folder on purpose, so it is left out
# of the duplication count; the original in source/browser-extension/ is still analysed.
#
# site/ is the website: a page with its styles and script, a pretend server for the live preview, and
# data and pictures made by tools (site/tools). Its pictures and its published release list are not code.
sonar.cpd.exclusions=browser-extension/chrome-unpacked/**,site/**
#
# source/packaging/cross/Dockerfile is the image of the developer's build toolchain (`make cross`), not something that is
# run or shipped. It runs as root on purpose: the toolchain installs into system folders and writes the archives into a
# folder shared with the host, which a fixed non-root user would make unwritable on some hosts.
sonar.exclusions=site/data/**,site/assets/img/**,source/packaging/cross/Dockerfile
