# Read by SonarQube Cloud's automatic analysis (it ignores sonar-project.properties).
#
# browser-extension/chrome-unpacked/ is a ready-made copy of source/browser-extension/ for people who
# browse the repository (see "HOW TO INSTALL.txt"). It repeats that folder on purpose, so it is left out
# of the duplication count; the original in source/browser-extension/ is still analysed.
sonar.cpd.exclusions=browser-extension/chrome-unpacked/**
