<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Swift Download Manager</title>
<style>
/* One flat design, light and dark: white cards on a light grey page, near-black text, one coral accent.
   No gradients, no images and nothing is loaded from other sites. */
:root {
  --bg: #f7f7f7; --card: #fff; --surface: #f2f2f2; --surface3: #e8e8e8; --track: #ebebeb;
  --label: #222; --secondary: #484848; --tertiary: #6a6a6a; --sep: #ebebeb; --sep-strong: #ddd; --border: #909090;
  --hover: rgba(0,0,0,.05); --press: rgba(0,0,0,.1);
  --accent: #ff385c; --accent-solid: #e31c5f; --accent-press: #d70466; --accent-ink: #d70466; --accent-tint: rgba(255,56,92,.10);
  --green: #34c759; --green-ink: #0f7b2f; --green-tint: rgba(52,199,89,.14);
  --orange: #ff9500; --orange-ink: #a35a00; --orange-tint: rgba(255,149,0,.14);
  --red: #c13515; --red-ink: #c13515; --red-tint: rgba(193,53,21,.10);
  --blue-ink: #005ecb;
  --shadow-rest: 0 1px 4px rgba(0,0,0,.08); --shadow-hover: 0 6px 18px rgba(0,0,0,.12); --shadow-sheet: 0 10px 34px rgba(0,0,0,.28);
  --radius: 16px; --ctl: 40px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f0f10; --card: #1c1c1e; --surface: #2c2c2e; --surface3: #3a3a3c; --track: #3a3a3c;
    --label: #f5f5f7; --secondary: #c7c7cc; --tertiary: #98989f; --sep: rgba(255,255,255,.10); --sep-strong: rgba(255,255,255,.18); --border: #6c6c70;
    --hover: rgba(255,255,255,.07); --press: rgba(255,255,255,.12);
    --accent-ink: #ff6b88; --accent-tint: rgba(255,56,92,.18);
    --green: #30d158; --green-ink: #30d158; --green-tint: rgba(48,209,88,.18);
    --orange: #ff9f0a; --orange-ink: #ff9f0a; --orange-tint: rgba(255,159,10,.18);
    --red: #ff6b4a; --red-ink: #ff8a70; --red-tint: rgba(255,107,74,.18);
    --blue-ink: #409cff;
    --shadow-rest: 0 1px 4px rgba(0,0,0,.4); --shadow-hover: 0 6px 18px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--label); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
svg { display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* The top bar */
.hdr { background: var(--card); border-bottom: 1px solid var(--sep); position: sticky; top: 0; z-index: 5; }
.hdr .in { max-width: 1120px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 12px; }
.logo { width: 38px; height: 38px; border-radius: 12px; background: var(--accent-solid); color: #fff; display: grid; place-items: center; flex: none; }
.logo svg { width: 24px; height: 24px; stroke-width: 2; }
.hdr h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: -.01em; color: var(--accent-ink); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who { color: var(--secondary); font-size: 13px; white-space: nowrap; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 24px 24px 56px; }

/* Buttons: capsules */
.btn { height: var(--ctl); padding: 0 20px; border-radius: 999px; border: 0; background: var(--surface); color: var(--label); font-weight: 600; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: background .12s, transform .08s, opacity .12s; }
.btn:hover { background: var(--surface3); }
.btn:active { transform: scale(.97); }
.btn:focus-visible, input:focus-visible, .seg button:focus-visible { outline: 2px solid var(--label); outline-offset: 2px; }
.btn.primary { background: var(--accent-solid); color: #fff; }
.btn.primary:hover { background: var(--accent-press); }
.btn.plain { background: transparent; }
.btn.plain:hover { background: var(--hover); }
.btn:disabled { opacity: .4; cursor: default; transform: none; }
.btn svg { width: 18px; height: 18px; }
.btn.icon { width: 36px; height: 36px; padding: 0; background: transparent; color: var(--secondary); }
.btn.icon:hover { background: var(--hover); color: var(--label); }
.btn.icon:active { background: var(--press); }
.btn.icon.danger:hover { color: var(--red-ink); }
.btn.icon svg { width: 20px; height: 20px; }

/* Inputs */
input[type=text], input[type=password], input[type=url] { height: var(--ctl); border-radius: 12px; border: 1px solid var(--border); background: var(--card); padding: 0 14px; min-width: 0; transition: border-color .12s; }
input:hover { border-color: var(--label); }
input:focus { outline: none; border-color: var(--label); box-shadow: 0 0 0 1px var(--label); }
input::placeholder { color: var(--tertiary); }
.search { position: relative; flex: 1 1 240px; max-width: 380px; }
.search input { width: 100%; border-radius: 999px; padding: 0 40px 0 42px; border-color: var(--sep-strong); }
.search > svg { position: absolute; left: 14px; top: 11px; width: 18px; height: 18px; color: var(--tertiary); pointer-events: none; }
.search .clear { position: absolute; right: 8px; top: 6px; width: 28px; height: 28px; }
.search .clear svg { width: 14px; height: 14px; }

/* Summary tiles */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--card); border: 1px solid var(--sep); border-radius: var(--radius); box-shadow: var(--shadow-rest); padding: 16px 20px; min-height: 84px; position: relative; }
.tile .k { font-size: 12px; font-weight: 600; color: var(--tertiary); }
.tile .v { font-size: 28px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; margin-top: 6px; }
.tile .v small { font-size: 12px; font-weight: 400; color: var(--secondary); margin-left: 6px; letter-spacing: 0; }
.tile .ic { position: absolute; right: 16px; top: 16px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--tint); color: var(--ink); }
.tile .ic svg { width: 18px; height: 18px; }
.tile.speed { --ink: var(--accent-ink); --tint: var(--accent-tint); }
.tile.active { --ink: var(--green-ink); --tint: var(--green-tint); }
.tile.queued { --ink: var(--orange-ink); --tint: var(--orange-tint); }
.tile.done { --ink: var(--blue-ink); --tint: rgba(0,122,255,.12); }

/* Adding a link */
.add { display: flex; gap: 8px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--sep); border-radius: var(--radius); box-shadow: var(--shadow-rest); padding: 12px; margin-bottom: 20px; }
.add input.url { flex: 1 1 320px; }
.add input.name { flex: 0 1 220px; }

/* Filters */
.bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 4px; }
.seg button { height: 32px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; cursor: pointer; color: var(--secondary); transition: background .15s, color .15s, box-shadow .15s; }
.seg button[aria-pressed=true] { background: var(--card); color: var(--label); font-weight: 600; box-shadow: var(--shadow-rest); }
.bar .count { color: var(--tertiary); font-size: 13px; margin-left: auto; }

/* Download cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 12px; }
.card { min-width: 0; background: var(--card); border: 1px solid var(--sep); border-radius: var(--radius); box-shadow: var(--shadow-rest); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 120px; transition: box-shadow .15s, border-color .15s; }
.card:hover { box-shadow: var(--shadow-hover); border-color: var(--sep-strong); }
.card .top { display: flex; gap: 12px; align-items: center; }
.badge { flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--ct); color: var(--c); display: grid; place-items: center; font-size: 11px; font-weight: 700; letter-spacing: .02em; }
.card .name { font-weight: 650; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .sub { color: var(--tertiary); font-size: 12px; }
.card .titles { min-width: 0; flex: 1; }
.chip { flex: none; font-size: 12px; font-weight: 600; padding: 0 12px 0 10px; height: 24px; line-height: 24px; border-radius: 999px; background: var(--surface); color: var(--secondary); display: inline-flex; align-items: center; gap: 6px; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .9; }
.chip.downloading, .chip.connecting { background: var(--accent-tint); color: var(--accent-ink); }
.chip.complete { background: var(--green-tint); color: var(--green-ink); }
.chip.error { background: var(--red-tint); color: var(--red-ink); }
.chip.paused { background: var(--orange-tint); color: var(--orange-ink); }
.progress { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .5s ease; }
.card.complete .progress i { background: var(--green); }
.card.error .progress i { background: var(--red); }
.card.paused .progress i { background: var(--orange); }
.row { display: flex; align-items: center; gap: 4px; min-height: 36px; }
.row .meta { color: var(--secondary); font-size: 12.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .err { color: var(--red-ink); }
.empty { text-align: center; color: var(--secondary); padding: 64px 16px; background: var(--card); border: 1px solid var(--sep); border-radius: var(--radius); }
.empty b { display: block; font-size: 20px; color: var(--label); margin-bottom: 4px; }

/* Bulk buttons, sorting, selects and text areas */
.tools { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
.btn.small { height: 32px; padding: 0 14px; font-size: 13px; }
.btn.small svg { width: 16px; height: 16px; }
.btn.outline { background: transparent; box-shadow: inset 0 0 0 1px var(--sep-strong); }
.btn.outline:hover { background: var(--hover); }
.btn.danger { background: var(--red-tint); color: var(--red-ink); }
select { height: var(--ctl); border-radius: 12px; border: 1px solid var(--border); background: var(--card); padding: 0 12px; }
select.small { height: 32px; border-radius: 999px; border-color: var(--sep-strong); padding: 0 12px; font-size: 13px; }
select:focus-visible, textarea:focus-visible { outline: 2px solid var(--label); outline-offset: 2px; }
textarea { width: 100%; min-height: 128px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); padding: 12px 14px; resize: vertical; line-height: 1.5; }
textarea::placeholder { color: var(--tertiary); }
.add .many { flex: 1 1 100%; display: flex; flex-direction: column; gap: 8px; }
.add .opts { flex: 1 1 100%; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.add .opts label { color: var(--secondary); font-size: 13px; display: inline-flex; align-items: center; gap: 8px; }
.bar .sort { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; color: var(--tertiary); font-size: 13px; }
.bar .count { margin-left: 0; }

/* A switch, like the one in the app */
.switch { position: relative; width: 51px; height: 31px; flex: none; display: inline-block; }
.switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.switch .track { position: absolute; inset: 0; border-radius: 999px; background: var(--surface3); transition: background .2s; pointer-events: none; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s cubic-bezier(.2,.8,.3,1); }
.switch input:checked + .track { background: var(--green); }
.switch input:checked + .track::after { transform: translateX(20px); }
.switch input:focus-visible + .track { outline: 2px solid var(--label); outline-offset: 2px; }
.switch input:disabled { cursor: default; }
.switch input:disabled + .track { opacity: .5; }

/* The settings sheet */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 20; padding: 16px; }
.sheet { width: min(680px, 100%); max-height: min(88vh, 800px); background: var(--card); border-radius: 24px; box-shadow: var(--shadow-sheet); display: flex; flex-direction: column; overflow: hidden; }
.sheet .head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 14px 24px; border-bottom: 1px solid var(--sep); }
.sheet .head h2 { margin: 0; font-size: 20px; flex: 1; letter-spacing: -.01em; }
.sheet .tabs { padding: 12px 24px 0; }
.sheet .body { padding: 8px 24px 24px; overflow: auto; }
.sheet h3 { margin: 18px 0 4px; font-size: 15px; }
.sheet p.note { margin: 2px 0 8px; color: var(--secondary); font-size: 13px; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--sep); }
.item:first-of-type { border-top: 0; }
.item .grow { flex: 1; min-width: 0; }
.item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .s { color: var(--tertiary); font-size: 12.5px; }
.item .live { font-variant-numeric: tabular-nums; color: var(--secondary); font-size: 12.5px; white-space: nowrap; }
.item .live.bad { color: var(--orange-ink); }
.form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.form input[type=text], .form input[type=password], .form input[type=number] { flex: 1 1 160px; }
input[type=number] { height: var(--ctl); border-radius: 12px; border: 1px solid var(--border); background: var(--card); padding: 0 14px; min-width: 0; }
.reveal { margin-top: 12px; padding: 14px; border-radius: 16px; background: var(--green-tint); }
.reveal b { display: block; margin-bottom: 6px; color: var(--green-ink); }
.code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; background: var(--surface); border-radius: 10px; padding: 10px 12px; word-break: break-all; user-select: all; }
.reveal .row2 { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; }
.reveal .row2 .code { flex: 1; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent-tint); color: var(--accent-ink); margin-left: 6px; vertical-align: middle; }

/* Sign in */
.login { max-width: 400px; margin: 12vh auto 0; background: var(--card); border: 1px solid var(--sep); border-radius: 24px; box-shadow: var(--shadow-sheet); padding: 32px; display: flex; flex-direction: column; gap: 12px; }
.login .logo { margin-bottom: 4px; }
.login h2 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
.login p { margin: 0 0 8px; color: var(--secondary); }
.login input { width: 100%; }
.login .err { color: var(--red-ink); min-height: 1.4em; font-size: 13px; }
.login .btn { width: 100%; }

.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--label); color: var(--card); font-weight: 600; padding: 12px 22px; border-radius: 999px; max-width: 90vw; box-shadow: var(--shadow-hover); }

@media (max-width: 720px) {
  .hdr .in, .wrap { padding-left: 16px; padding-right: 16px; }
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .tile .v { font-size: 24px; }
}
@media (max-width: 480px) { .grid { grid-template-columns: minmax(0, 1fr); } .hdr h1 { font-size: 16px; } }
@media (max-width: 560px) { .add .btn, .add input.name { flex: 1 1 100%; } .search { max-width: none; flex-basis: 100%; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
// Everything shown comes from the server's answers and is put on the page as plain text,
// never as HTML, so a file name cannot run code.
const $app = document.getElementById("app");
const ICONS = {
  logo: "M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14",
  pause: "M9 5v14M15 5v14",
  play: "M8 5l11 7-11 7z",
  trash: "M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 001 1h8a1 1 0 001-1l1-12M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2",
  speed: "M4 17a8 8 0 1116 0M12 17l4-5",
  hourglass: "M7 4h10M7 20h10M8 4c0 4 4 5 4 8s-4 4-4 8M16 4c0 4-4 5-4 8s4 4 4 8",
  check: "M21 12a9 9 0 11-18 0 9 9 0 0118 0zM8 12.5l2.7 2.7L16 9.8",
  search: "M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-4-4",
  close: "M6 6l12 12M18 6L6 18",
  down: "M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14",
  plus: "M12 5v14M5 12h14",
  gear: "M15 12a3 3 0 11-6 0 3 3 0 016 0zM19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z",
  copy: "M9 9h11v11H9zM5 15V5h10",
};
function svg(path) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", path);
  s.appendChild(p);
  return s;
}
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return e;
}
function iconButton(label, path, onclick, extra) {
  const b = h("button", { class: "btn icon " + (extra || ""), type: "button", title: label, "aria-label": label, onclick });
  b.appendChild(svg(path));
  return b;
}
const fmtBytes = (n) => {
  if (!n) return "0 B";
  const u = ["B", "KB", "MB", "GB", "TB"];
  const i = Math.min(u.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
  const v = n / Math.pow(1024, i);
  return (v >= 100 || i === 0 ? v.toFixed(0) : v.toFixed(v >= 10 ? 1 : 2)) + " " + u[i];
};
const fmtTime = (s) => {
  if (!isFinite(s) || s <= 0) return "";
  if (s < 60) return Math.round(s) + " s left";
  if (s < 3600) return Math.round(s / 60) + " min left";
  return (s / 3600).toFixed(1) + " h left";
};
const STATES = { queued: "Queued", connecting: "Connecting", downloading: "Downloading", paused: "Paused", complete: "Complete", error: "Failed" };
// The colour of a file type, like the tiles in the app.
const CATS = { Compressed: [214, 130, 20], Documents: [52, 120, 210], Music: [170, 80, 190], Programs: [40, 160, 100], Video: [226, 60, 80], General: [120, 130, 145] };
function catColor(name) {
  if (CATS[name]) return CATS[name];
  const P = [[0, 150, 160], [220, 110, 40], [120, 90, 200], [190, 60, 120], [90, 140, 40], [60, 100, 170]];
  let n = 7;
  for (const ch of String(name || "")) n = (Math.imul(n, 31) + ch.charCodeAt(0)) >>> 0;
  return P[n % 6];
}

let me = null, items = [], stat = null, filter = "all", query = "", timer = null, lastJson = "";
// How the list is ordered, whether the add form takes many links, and the queues and categories to pick from.
let sortBy = "new", bulk = false, lists = { queues: [], categories: [] };

async function api(method, path, body) {
  const opts = { method, credentials: "same-origin", headers: { "X-SDM-Request": "1" } };
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  let r;
  try { r = await fetch(path, opts); } catch (e) { return { ok: false, status: 0, data: { error: "The server is not reachable" } }; }
  let data = null;
  try { data = await r.json(); } catch (e) { data = {}; }
  return { ok: r.ok, status: r.status, data };
}
function toast(text) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = h("div", { class: "toast", role: "status" }, text);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

function logo() { return h("div", { class: "logo" }, svg(ICONS.logo)); }

function header() {
  return h("div", { class: "hdr" }, h("div", { class: "in" },
    logo(),
    h("h1", null, "Swift Download Manager"),
    me && me.shared ? h("span", { class: "who" }, me.user + (me.admin ? " (administrator)" : "")) : null,

const SORTS = [["new", "Newest first"], ["old", "Oldest first"], ["name", "Name"], ["size", "Largest"], ["progress", "Most complete"], ["status", "Status"]];

function sorted(list) {
  const by = {
    new: (a, b) => b.id - a.id,
    old: (a, b) => a.id - b.id,
    name: (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" }),
    size: (a, b) => (b.size_bytes || 0) - (a.size_bytes || 0),
    progress: (a, b) => (b.progress || 0) - (a.progress || 0),
    status: (a, b) => ORDER.indexOf(a.status) - ORDER.indexOf(b.status) || b.id - a.id,

  return list.slice().sort(by);
}

function visible() {

// Networks of the server, and the overall speed limit (administrators).
function netTab(body) {
  let n = null, lastKey = "", timer = null, stopped = false;
  const key = (x) => JSON.stringify([x.enabled, x.automatic, x.chosen, x.off, x.available]);
  const spans = new Map();
  const liveFor = (name) => (n.live || []).find((x) => x.name === name);
  const liveText = (c) => {
    const l = liveFor(c.name);
    if (!l) return "";
    if (l.state === "gone") return "not connected";
    if (l.state === "resting") return "resting";
    return fmtBytes(l.speed_bytes_per_sec) + "/s · " + l.connections + (l.connections === 1 ? " connection" : " connections");
  };
  const used = (c) => (n.automatic ? !n.off.includes(c.name) : n.chosen.includes(c.name));
  const save = async (patch) => {
    const r = await api("POST", "/api/networks", patch);

    n = r.data; lastKey = key(n); draw();
  };
  const toggle = (c, on) => {
    // By hand the switch means "use it"; in automatic mode it means "do not leave it out".
    const which = n.automatic ? "off" : "chosen";
    const list = n[which].filter((x) => x !== c.name);
    if (n.automatic ? !on : on) list.push(c.name);
    save({ [which]: list });
  };
  const setLimit = async (kbps) => {
    const r = await api("POST", "/api/speed-limit", { kbps });
    if (!r.ok) { toast(r.data.error || "That did not work"); return; }
    stat = Object.assign({}, stat, { speed_limit_kbps: r.data.speed_limit_kbps });
    draw();
  };

    spans.clear();
    const limit = stat && stat.speed_limit_kbps;
    const kb = h("input", { type: "number", min: "1", max: "1000000", placeholder: "KB/s", "aria-label": "Speed limit in KB/s", value: limit || "" });
    const rows = n.available.length ? n.available.map((c) => {
      const l = liveFor(c.name);
      const live = h("span", { class: "live" + (l && l.state !== "working" ? " bad" : "") }, liveText(c));
      spans.set(c.name, live);
      return h("div", { class: "item" }, h("div", { class: "grow" }, h("div", { class: "t" }, c.name), h("div", { class: "s" }, c.kind + " · " + c.address)), live, switchEl(used(c), (on) => toggle(c, on), c.name + " in use", !n.enabled));
    }) : [h("p", { class: "note" }, "No connected network was found on the server.")];
    body.replaceChildren(
      h("h3", null, "Several networks at once"),
      h("p", { class: "note" }, "Each download is spread over every network picked here (Wi-Fi, Ethernet, a phone with USB tethering ...), so their speeds add up. A network plugged in or unplugged while a download runs is picked up or skipped within a few seconds."),
      h("div", { class: "item" }, h("div", { class: "grow" }, h("div", { class: "t" }, "Download over several networks")), switchEl(n.enabled, (on) => save({ enabled: on }), "Download over several networks")),
      h("div", { class: "item" }, h("div", { class: "grow" }, h("div", { class: "t" }, "Use every connected network automatically"), h("div", { class: "s" }, "Includes ones plugged in later. Stands back while a VPN is connected.")), switchEl(n.automatic, (on) => save({ automatic: on }), "Use every connected network automatically", !n.enabled)),
      ...rows,
      h("h3", null, "Overall speed limit"),
      h("p", { class: "note" }, limit ? "All downloads together are limited to " + limit + " KB/s." : "There is no limit."),
      h("div", { class: "form" }, kb,
        h("button", { class: "btn small primary", type: "button", onclick: () => { const v = Number.parseInt(kb.value, 10); if (v > 0) setLimit(v); else toast("Enter the limit in KB/s"); } }, "Set limit"),
        limit ? h("button", { class: "btn small outline", type: "button", onclick: () => setLimit(0) }, "Remove limit") : null));
  }
  const tick = async () => {
    const r = await api("GET", "/api/networks");
    if (stopped) return;
    if (!r.ok) { if (!n) body.replaceChildren(h("p", { class: "note" }, r.data.error || "Could not load the networks")); return; }
    const first = !n;
    n = r.data;

    }
  };
  tick();
  timer = setInterval(tick, 2000);
  return () => { stopped = true; clearInterval(timer); };

    const r = await api("GET", "/api/users");
    if (!r.ok) { body.replaceChildren(h("p", { class: "note" }, r.data.error || "Could not load the accounts")); return; }
    draw(r.data.users || []);
  };
  load();
  return null;
}

async function refresh() {
  const [d, s] = await Promise.all([api("GET", "/api/downloads?limit=500"), api("GET", "/api/status")]);
  if (d.status === 401 || s.status === 401) { showLogin(!!(d.data && d.data.shared), "Your session ended. Please sign in again."); return; }
  if (!d.ok) return;
  items = d.data.downloads || [];
  stat = s.ok ? s.data : stat;
  const json = JSON.stringify([items, stat]);
  if (json === lastJson) return;
  lastJson = json;
  // Keep the cursor in the search box while the list updates.
  // The tab shows the speed, so a download can be watched from another tab.
  const sp = (stat && stat.speed_bytes_per_sec) || 0;
  document.title = (sp > 0 ? "↓ " + fmtBytes(sp) + "/s · " : "") + "Swift Download Manager";
  if (document.getElementById("list")) {
    const t = document.querySelector(".tiles");
    if (t) t.replaceWith(tiles());
    const bar = document.querySelector(".tools");
    if (bar) bar.replaceWith(toolsRow());
    renderList();
  } else render();
}

function start() { stop(); timer = setInterval(() => { if (!document.hidden) refresh(); }, 1500); }
function stop() { if (timer) clearInterval(timer); timer = null; }

async function boot() {
  const r = await api("GET", "/api/me");
  if (r.status === 401) { showLogin(!!(r.data && r.data.shared)); return; }
  if (!r.ok) { $app.replaceChildren(h("div", { class: "wrap" }, h("div", { class: "empty" }, h("b", null, "Cannot reach the server"), "Reload the page to try again."))); return; }
  me = r.data;
  lastJson = "";
  // The queues and file types to choose from when adding (the page still works without them).
  const q = await api("GET", "/api/queues");
  if (q.ok) lists = { queues: (q.data.queues || []).map((x) => x.name), categories: q.data.categories || [] };
  await refresh();
  render();
  start();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && me) refresh(); });
boot();
</script>
</body>
</html>
