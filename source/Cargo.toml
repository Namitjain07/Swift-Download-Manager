[package]
name = "swift_download_manager"
version = "1.9.0"
edition = "2024"
description = "Swift Download Manager: a fast download manager with split downloads, pause/resume, queues, scheduler and browser add-on"
license = "MIT"

[dependencies]
eframe = "0.37"
egui_extras = "0.37"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
url = "2"
sha2 = "0.11"
chrono = "0.4"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
rfd = "0.17"
getrandom = "0.4"
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15.0"
ctrlc = { version = "3", features = ["termination"] }

# The tray icon. One API on every system; on Linux and the BSDs it talks to the desktop directly (no GTK needed).
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd", target_os = "dragonfly"))'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }
# The same winit that eframe uses; Windows and macOS need an event loop for the tray icon.
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

# The Windows look: the system accent and settings (UISettings, the same source WinUI 3 reads), the Mica and Acrylic backdrops and
# the dark title bar (DWM). Only Windows builds have it; everywhere else the WinUI 3 theme is the look without the system link.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "UI_ViewManagement", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
