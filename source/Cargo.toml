[package]
name = "swift_download_manager"
version = "1.2.0"
edition = "2024"
description = "Swift Download Manager: a fast download manager with split downloads, pause/resume, queues, scheduler and browser add-on"
license = "MIT"

[dependencies]
eframe = "0.37"
egui_extras = "0.37"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
url = "2"
sha2 = "0.11"
chrono = "0.4"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
rfd = "0.17"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
