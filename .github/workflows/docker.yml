# Builds the Docker image (the download server for a team), checks that it works, and publishes it.
#
#   pull requests that touch the server or the Dockerfile: build and smoke-test only
#   a tag such as v1.6.0-beta.1:  build, smoke-test, then publish to ghcr.io/namitjain07/swift-download-manager
#   Actions > Docker > Run workflow:  build and smoke-test only
#
# A tag with a dash (1.6.0-beta.1) is a pre-release: it gets its own version tag and the "beta" tag, never "latest".
name: Docker

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "source/Dockerfile"
      - "source/src/**"
      - "source/Cargo.toml"
      - "source/Cargo.lock"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/namitjain07/swift-download-manager

jobs:
  image:
    name: Build, test and publish the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: source
          load: true
          tags: sdm-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it and use it
        run: |
          docker run -d --name sdm -p 8080:8080 \
            -e SDM_ADMIN_USER=admin -e SDM_ADMIN_PASSWORD='ci test password' sdm-test:ci
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' sdm)" = healthy ] && break
            sleep 2
          done
          docker logs sdm
          test "$(docker inspect -f '{{.State.Health.Status}}' sdm)" = healthy

          # The page loads, a wrong password is refused, the right one signs in.
          curl -fsS http://localhost:8080/ | grep -q "Swift Download Manager"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/status)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-SDM-Request: 1' -d '{"user":"admin","password":"wrong"}' http://localhost:8080/api/login)" = 401
          curl -fsS -c jar.txt -X POST -H 'X-SDM-Request: 1' -d '{"user":"admin","password":"ci test password"}' http://localhost:8080/api/login
          curl -fsS -b jar.txt http://localhost:8080/api/me | grep -q '"admin":true'
          curl -fsS -b jar.txt http://localhost:8080/api/status | grep -q '"downloads":0'

          # Links to private addresses are refused (the server must not be a way into the network behind it).
          id=$(curl -fsS -b jar.txt -X POST -H 'X-SDM-Request: 1' -d '{"url":"http://127.0.0.1:8080/favicon.ico","name":"x.bin"}' http://localhost:8080/api/downloads | sed 's/.*"id":\([0-9]*\).*/\1/')
          for i in $(seq 1 20); do
            curl -fsS -b jar.txt http://localhost:8080/api/downloads/$id | grep -q '"status":"error"' && break
            sleep 1
          done
          curl -fsS -b jar.txt http://localhost:8080/api/downloads/$id | grep -q 'private or local'

          # It stops cleanly when asked.
          docker stop -t 20 sdm
          test "$(docker inspect -f '{{.State.ExitCode}}' sdm)" = 0

      - name: Work out the tags
        id: meta
        if: github.ref_type == 'tag'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-') }}

      - name: Sign in to the GitHub container registry
        if: github.ref_type == 'tag'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: source
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
