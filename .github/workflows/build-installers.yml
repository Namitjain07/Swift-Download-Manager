# Builds the Linux .deb, the Windows zip, the Mac .dmg and the browser add-on packages on GitHub's own
# computers. Open the "Actions" tab, pick "Build installers" and press "Run workflow"; the files
# appear under "Artifacts".
#
# This only builds files for you to download. To publish a release, push a version tag (see release.yml).
name: Build installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash packaging/linux/build-deb.sh
        working-directory: source
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: source/dist/*.deb

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $out = "dist/SwiftDownloadManager-$v-windows-x64"
          New-Item -ItemType Directory -Force "$out/browser-extension" | Out-Null
          Copy-Item target/release/swift_download_manager.exe "$out/SwiftDownloadManager.exe"
          Copy-Item browser-extension/* "$out/browser-extension/" -Recurse
          Copy-Item README.md "$out/"
          Compress-Archive -Path $out -DestinationPath "$out.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: source/dist/*.zip

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash packaging/macos/build-mac.sh
        working-directory: source
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: source/dist/*.dmg

  browser-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 packaging/browser/build_extension.py
        working-directory: source
      - uses: actions/upload-artifact@v4
        with:
          name: browser-addon
          path: |
            source/dist/browser/*.zip
            source/dist/browser/*.xpi
