# Builds the app and runs its automatic tests on every push to main and on every pull request,
# on Linux, Windows and macOS. It also checks that the browser add-on packages can be built.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked

  browser-addon:
    name: Build the browser add-on
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - run: python3 packaging/browser/build_extension.py
