<!doctype html>
<html><head><meta charset="utf-8"><style>
/* The picture that shows when the link is shared (1200x630). Rendered by tools/make-og.sh with a headless browser. */
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;color:#fff;background:#0b0b12;position:relative}
.glow{position:absolute;border-radius:50%;filter:blur(90px)}
.g1{width:620px;height:620px;left:-160px;top:-200px;background:rgba(255,56,92,.55)}
.g2{width:640px;height:640px;right:-200px;bottom:-260px;background:rgba(139,92,246,.55)}
.g3{width:420px;height:420px;left:380px;bottom:-240px;background:rgba(255,149,0,.28)}
.copy{position:absolute;left:72px;top:96px;width:520px}
.brand{display:flex;align-items:center;gap:16px;font-size:30px;font-weight:700;letter-spacing:-.01em}
.mark{width:56px;height:56px;border-radius:17px;background:linear-gradient(140deg,#ff4d73,#e31c5f 55%,#c2124f);display:grid;place-items:center;box-shadow:0 10px 30px -8px rgba(227,28,95,.9),inset 0 1px 0 rgba(255,255,255,.35)}
.mark svg{width:32px;height:32px;fill:none;stroke:#fff;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:76px;line-height:1.02;letter-spacing:-.04em;margin-top:44px;font-weight:780}
h1 span{background:linear-gradient(100deg,#ff385c,#ff7a45 40%,#b45cff);-webkit-background-clip:text;color:transparent}
p{font-size:26px;line-height:1.4;color:rgba(255,255,255,.72);margin-top:26px}
.pills{display:flex;gap:12px;margin-top:34px}
.pills b{font-size:19px;font-weight:650;padding:9px 18px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
.shot{position:absolute;left:640px;top:96px;width:700px;border-radius:14px;overflow:hidden;transform:perspective(1400px) rotateY(-14deg) rotateX(5deg) rotate(-1deg);box-shadow:0 50px 100px -20px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.14)}
.shot img{display:block;width:100%}
.shot2{left:700px;top:330px;width:560px;transform:perspective(1400px) rotateY(-14deg) rotateX(5deg) rotate(-1deg) translateZ(40px)}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="copy">
  <div class="brand"><div class="mark"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg></div>Swift Download Manager</div>
  <h1>Every download, <span>accelerated.</span></h1>
  <p>Free and open source for Windows, Linux and macOS.</p>
  <div class="pills"><b>32 connections</b><b>15 themes</b><b>MCP</b></div>
</div>
<div class="shot"><img src="../assets/img/themes/coral-light.webp"></div>
<div class="shot shot2"><img src="../assets/img/themes/winui-dark.webp"></div>
</body></html>
